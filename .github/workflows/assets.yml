# Updates readme.txt and .wordpress-org assets (banner, icon, screenshots)
# on WordPress.org without a new release, e.g. after bumping "Tested up to".

name: Update WordPress.org readme and assets

on:
  push:
    branches:
      - master
    paths:
      - "readme.txt"
      - ".wordpress-org/**"

jobs:
  assets:
    name: Push readme and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: lukstack-uptime-monitor
          IGNORE_OTHER_FILES: true
